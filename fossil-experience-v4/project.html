<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About Expand Your World · NKU AI Native Studio</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="styles.css?v=20261102-nonumber2">
<link rel="stylesheet" href="release.css?v=20261102-nonumber2">
<link rel="stylesheet" href="theme-nku.css?v=20261102-nonumber2">
<style>
.project-page{width:min(760px,calc(100% - 24px));margin:0 auto;padding:28px 0 40px}
.project-card{background:#fff;color:#000;border:2px solid #000;border-top:8px solid #FFC72C;border-radius:24px;padding:clamp(24px,5vw,48px)}
.project-card h1{font-size:clamp(2.5rem,9vw,5rem);line-height:.92;margin:.5rem 0 1rem}
.project-card h2{font-size:1.25rem;line-height:1.2;margin:1.8rem 0 .6rem}
.project-card p{font-size:1rem;line-height:1.55;color:#333;max-width:58ch}
.project-points{display:grid;gap:12px;margin:18px 0 26px;padding:0;list-style:none}
.project-points li{border-left:5px solid #FFC72C;padding:10px 14px;background:#FFF8E3;line-height:1.45}
.project-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:26px}
.project-actions a{text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:16px;font-weight:900}
@media(max-width:520px){.project-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-dot" aria-hidden="true"></span><div><strong>Expand Your World</strong><span>CMC × NKU AI Native Studio</span></div></div>
  <div class="study-meta"><span class="event-pill">NKU AI DAY</span></div>
</header>
<main class="project-page">
  <article class="project-card">
    <span id="aboutEyebrow" class="eyebrow">ABOUT THE PROJECT</span>
    <h1 id="aboutHeadline">What are we testing?</h1>
    <p id="aboutIntro"></p>
    <h2 id="aboutSection1Heading"></h2>
    <p id="aboutSection1Body"></p>
    <h2 id="aboutSection2Heading"></h2>
    <p id="aboutSection2Body"></p>
    <h2 id="aboutSection3Heading"></h2>
    <p id="aboutSection3Body"></p>
    <div class="project-actions">
      <a class="primary" href="index.html">Explore again</a>
      <a class="secondary" href="javascript:history.back()">Back</a>
    </div>
  </article>
</main>
<script>
(async()=>{
  const $=id=>document.getElementById(id);
  try{
    let j=null;
    const draft=new URLSearchParams(location.search).get('draft')==='1';
    if(draft){try{j=JSON.parse(localStorage.getItem('expand-your-world-journey-draft-v1')||'null')}catch{}}
    if(!j){const r=await fetch('journey.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Could not load journey.');j=await r.json()}
    const a=j.about||{};
    document.querySelector('.brand strong').textContent=j.title||'Expand Your World';
    document.querySelector('.brand div span:last-child').textContent=j.brandLine||'';
    document.querySelector('.event-pill').textContent=j.eventLabel||'';
    $('aboutEyebrow').textContent=a.eyebrow||'ABOUT THE PROJECT';
    $('aboutHeadline').textContent=a.headline||'Learn more';
    $('aboutIntro').textContent=a.intro||'';
    $('aboutSection1Heading').textContent=a.section1Heading||'';
    $('aboutSection1Body').textContent=a.section1Body||'';
    $('aboutSection2Heading').textContent=a.section2Heading||'';
    $('aboutSection2Body').textContent=a.section2Body||'';
    $('aboutSection3Heading').textContent=a.section3Heading||'';
    $('aboutSection3Body').textContent=a.section3Body||'';
    document.title=(j.title||'Journey')+' · Learn more';
  }catch(e){console.error(e)}
})();
</script>
</body>
</html>
