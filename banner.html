<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Brandi Neal LinkedIn Banner</title>

  <style>
    :root {
      --navy-dark: #061a2c;
      --navy: #0a3150;
      --teal-dark: #0e5662;
      --blue: #36a9ff;
      --teal: #43e0ca;
      --white: #f8fbff;
      --soft-white: #dbe8f2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      background: #e7edf3;
      color: #102033;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(100%, 1584px);
    }

    /*
      LinkedIn banner dimensions:
      1584 × 396 pixels
    */
    .banner {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 1;
      overflow: hidden;
      isolation: isolate;

      background:
        radial-gradient(
          circle at 54% 48%,
          rgba(54, 169, 255, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 94% 78%,
          rgba(67, 224, 202, 0.15),
          transparent 30%
        ),
        linear-gradient(
          112deg,
          var(--navy-dark) 0%,
          var(--navy) 67%,
          var(--teal-dark) 100%
        );

      box-shadow: 0 22px 50px rgba(6, 26, 44, 0.22);
    }

    /*
      LinkedIn's profile photo overlaps the lower-left area.
      Important text starts farther to the right.
    */
    .profile-photo-safe-zone {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 34%;
      height: 76%;
      z-index: -1;

      background:
        radial-gradient(
          circle at 12% 100%,
          rgba(255, 255, 255, 0.04),
          transparent 66%
        );
    }

    .content {
      position: absolute;
      left: 36.5%;
      right: 5%;
      top: 10%;
      bottom: 10%;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin: 0 0 12px;

      color: var(--teal);
      font-size: clamp(16px, 1.35vw, 22px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 930px;
      margin: 0;

      color: var(--white);
      font-size: clamp(54px, 5.8vw, 92px);
      font-weight: 900;
      line-height: 0.91;
      letter-spacing: -0.055em;
    }

    h1 .accent {
      display: block;
      color: var(--blue);
    }

    .supporting-line {
      margin: 24px 0 0;

      color: var(--soft-white);
      font-size: clamp(20px, 2.1vw, 32px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    /*
      Decorative network is intentionally faint so it does
      not compete with the typography.
    */
    .visual {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }

    .node {
      position: absolute;
      width: 10px;
      height: 10px;

      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 18px rgba(54, 169, 255, 0.75);
    }

    .node.teal {
      background: var(--teal);
      box-shadow: 0 0 18px rgba(67, 224, 202, 0.75);
    }

    .edge {
      position: absolute;
      height: 1px;
      transform-origin: left center;

      background:
        linear-gradient(
          90deg,
          rgba(54, 169, 255, 0.05),
          rgba(54, 169, 255, 0.4),
          rgba(67, 224, 202, 0.16)
        );
    }

    .ring {
      position: absolute;
      border: 1px solid rgba(185, 224, 244, 0.14);
      border-radius: 50%;
    }

    .ring.one {
      width: 420px;
      height: 420px;
      right: -85px;
      top: -140px;
    }

    .ring.two {
      width: 245px;
      height: 245px;
      right: 58px;
      top: 12px;
      border-color: rgba(67, 224, 202, 0.17);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      margin-top: 16px;
    }

    .instructions {
      max-width: 980px;
      margin: 0;

      font-size: 14px;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;

      background: var(--navy-dark);
      color: #ffffff;

      font: 700 14px Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #13466e;
      outline: 3px solid rgba(54, 169, 255, 0.3);
      outline-offset: 2px;
    }

    @media (max-width: 850px) {
      body {
        padding: 12px;
      }

      .content {
        left: 33%;
        right: 3%;
        top: 7%;
        bottom: 7%;
      }

      .eyebrow {
        margin-bottom: 6px;
      }

      .supporting-line {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section
      class="banner"
      aria-label="LinkedIn banner for an enterprise AI transformation leader"
    >
      <div
        class="profile-photo-safe-zone"
        aria-hidden="true"
      ></div>

      <div
        class="visual"
        aria-hidden="true"
      >
        <div class="ring one"></div>
        <div class="ring two"></div>

        <span
          class="node"
          style="left: 73%; top: 18%;"
        ></span>

        <span
          class="node teal"
          style="left: 82%; top: 31%;"
        ></span>

        <span
          class="node"
          style="left: 92%; top: 16%;"
        ></span>

        <span
          class="node teal"
          style="left: 77%; top: 75%;"
        ></span>

        <span
          class="node"
          style="left: 89%; top: 65%;"
        ></span>

        <span
          class="node teal"
          style="left: 96%; top: 82%;"
        ></span>

        <span
          class="edge"
          style="
            left: 73.4%;
            top: 19%;
            width: 150px;
            transform: rotate(14deg);
          "
        ></span>

        <span
          class="edge"
          style="
            left: 82.4%;
            top: 32%;
            width: 160px;
            transform: rotate(-20deg);
          "
        ></span>

        <span
          class="edge"
          style="
            left: 77.4%;
            top: 76%;
            width: 190px;
            transform: rotate(-9deg);
          "
        ></span>

        <span
          class="edge"
          style="
            left: 89.4%;
            top: 66%;
            width: 120px;
            transform: rotate(28deg);
          "
        ></span>
      </div>

      <div class="content">

        <p class="eyebrow">
          Enterprise AI Transformation
        </p>

        <h1>
          Building AI that
          <span class="accent">
            people actually use.
          </span>
        </h1>

        <p class="supporting-line">
          Strategy&nbsp; • &nbsp;Products&nbsp; • &nbsp;Adoption
        </p>

      </div>
    </section>

    <div class="controls">

      <p class="instructions">
        Open this file in Chrome at 100% zoom, then select
        <strong>Save banner as PNG</strong>. The exported image is exactly
        <strong>1584 × 396 pixels</strong>.
      </p>

      <button
        type="button"
        onclick="downloadBanner()"
      >
        Save banner as PNG
      </button>

    </div>
  </main>

  <script>
    "use strict";

    function drawNode(ctx, x, y, color) {
      ctx.save();

      ctx.shadowColor = color;
      ctx.shadowBlur = 16;
      ctx.fillStyle = color;

      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function downloadBanner() {
      const width = 1584;
      const height = 396;

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");

      if (!ctx) {
        alert(
          "Your browser could not create the image. Please try Chrome or Edge."
        );
        return;
      }

      /*
        Background
      */
      const background = ctx.createLinearGradient(
        0,
        0,
        width,
        height
      );

      background.addColorStop(0, "#061a2c");
      background.addColorStop(0.67, "#0a3150");
      background.addColorStop(1, "#0e5662");

      ctx.fillStyle = background;
      ctx.fillRect(0, 0, width, height);

      /*
        Light glow behind the headline
      */
      const headlineGlow = ctx.createRadialGradient(
        850,
        190,
        0,
        850,
        190,
        470
      );

      headlineGlow.addColorStop(
        0,
        "rgba(54,169,255,0.15)"
      );

      headlineGlow.addColorStop(
        1,
        "rgba(54,169,255,0)"
      );

      ctx.fillStyle = headlineGlow;
      ctx.fillRect(0, 0, width, height);

      /*
        Right-side teal glow
      */
      const tealGlow = ctx.createRadialGradient(
        1490,
        325,
        0,
        1490,
        325,
        350
      );

      tealGlow.addColorStop(
        0,
        "rgba(67,224,202,0.17)"
      );

      tealGlow.addColorStop(
        1,
        "rgba(67,224,202,0)"
      );

      ctx.fillStyle = tealGlow;
      ctx.fillRect(0, 0, width, height);

      /*
        Subtle network
      */
      const nodes = [
        [1155, 70, "#36a9ff"],
        [1295, 122, "#43e0ca"],
        [1455, 62, "#36a9ff"],
        [1220, 297, "#43e0ca"],
        [1410, 257, "#36a9ff"],
        [1515, 325, "#43e0ca"]
      ];

      const edges = [
        [0, 1],
        [1, 2],
        [3, 4],
        [4, 5]
      ];

      ctx.lineWidth = 1.25;

      edges.forEach(([from, to]) => {
        const edgeGradient =
          ctx.createLinearGradient(
            nodes[from][0],
            nodes[from][1],
            nodes[to][0],
            nodes[to][1]
          );

        edgeGradient.addColorStop(
          0,
          "rgba(54,169,255,0.05)"
        );

        edgeGradient.addColorStop(
          0.55,
          "rgba(54,169,255,0.42)"
        );

        edgeGradient.addColorStop(
          1,
          "rgba(67,224,202,0.17)"
        );

        ctx.strokeStyle = edgeGradient;

        ctx.beginPath();
        ctx.moveTo(
          nodes[from][0],
          nodes[from][1]
        );

        ctx.lineTo(
          nodes[to][0],
          nodes[to][1]
        );

        ctx.stroke();
      });

      nodes.forEach(([x, y, color]) => {
        drawNode(ctx, x, y, color);
      });

      /*
        Text
      */
      const left = 578;

      ctx.fillStyle = "#43e0ca";
      ctx.font = "800 22px Arial";

      ctx.fillText(
        "ENTERPRISE AI TRANSFORMATION",
        left,
        76
      );

      ctx.fillStyle = "#f8fbff";
      ctx.font = "900 76px Arial";

      ctx.fillText(
        "Building AI that",
        left,
        163
      );

      ctx.fillStyle = "#36a9ff";

      ctx.fillText(
        "people actually use.",
        left,
        235
      );

      ctx.fillStyle = "#dbe8f2";
      ctx.font = "700 31px Arial";

      ctx.fillText(
        "Strategy  •  Products  •  Adoption",
        left,
        307
      );

      /*
        Download image
      */
      const download =
        document.createElement("a");

      download.download =
        "Brandi_Neal_LinkedIn_Banner.png";

      download.href =
        canvas.toDataURL("image/png");

      download.click();
    }
  </script>
</body>
</html>
