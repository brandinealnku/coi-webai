<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brandi Neal LinkedIn Banner</title>

  <style>
    :root {
      --navy-950: #06111f;
      --navy-900: #0a1a2c;
      --navy-800: #102a44;

      --pink: #ff3d9a;
      --violet: #8b76ff;
      --blue: #4aa8ff;

      --white: #f8fbff;
      --muted: #d2dce7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;

      background: #e8edf3;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      color: #102033;
    }

    .page {
      width: min(100%, 1584px);
    }

    /*
      LINKEDIN BANNER
      Exact export size: 1584 × 396
    */

    .banner {
      position: relative;

      width: 100%;
      aspect-ratio: 4 / 1;

      overflow: hidden;
      isolation: isolate;

      background:
        radial-gradient(
          circle at 58% 42%,
          rgba(74, 168, 255, 0.07),
          transparent 31%
        ),
        radial-gradient(
          circle at 92% 34%,
          rgba(139, 118, 255, 0.09),
          transparent 25%
        ),
        linear-gradient(
          112deg,
          var(--navy-950) 0%,
          var(--navy-900) 64%,
          var(--navy-800) 100%
        );

      box-shadow:
        0 22px 50px
        rgba(6, 17, 31, 0.22);
    }

    /*
      LinkedIn profile photo overlaps the lower-left.
      This area intentionally contains no important text.
    */

    .photo-safe-area {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 27%;
      height: 66%;

      z-index: -1;

      background:
        radial-gradient(
          circle at 12% 100%,
          rgba(255,255,255,0.035),
          transparent 65%
        );
    }

    /*
      PRIMARY CONTENT

      Slightly farther right than the previous version
      to create more visual breathing room from the photo.
    */

    .content {
      position: absolute;

      left: 29%;
      right: 24%;

      top: 13%;
      bottom: 12%;

      z-index: 3;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin: 0 0 12px;

      color: var(--pink);

      font-size:
        clamp(15px, 1.2vw, 19px);

      font-weight: 800;

      line-height: 1;

      letter-spacing: 0.17em;

      text-transform: uppercase;
    }

    h1 {
      max-width: 910px;

      margin: 0;

      color: var(--white);

      font-size:
        clamp(43px, 4.05vw, 57px);

      font-weight: 850;

      line-height: 0.98;

      letter-spacing: -0.038em;
    }

    h1 .accent {
      color: var(--pink);
    }

    .personality-line {
      margin: 22px 0 0;

      color: var(--muted);

      font-size:
        clamp(22px, 2vw, 29px);

      font-weight: 650;

      line-height: 1.15;

      letter-spacing: -0.01em;
    }

    /*
      ITSBAD KEYBOARD / DESIGN MOTIF

      Entirely confined to the far-right side.
      Designed as a watermark, not a competing illustration.
    */

    .keyboard-mark {
      position: absolute;

      right: -2%;
      top: 12%;

      width: 24%;
      height: 73%;

      z-index: 1;

      opacity: 0.31;

      transform:
        perspective(700px)
        rotateY(-9deg)
        rotateZ(-3deg);

      pointer-events: none;
    }

    .key {
      position: absolute;

      width: 60px;
      height: 60px;

      border:
        1px solid
        rgba(202, 214, 227, 0.17);

      border-radius: 11px;

      background:
        rgba(255, 255, 255, 0.012);
    }

    .key.blue {
      border-color:
        rgba(74, 168, 255, 0.32);
    }

    .key.violet {
      border-color:
        rgba(139, 118, 255, 0.32);
    }

    /*
      Slightly stronger pink key to visually connect
      the motif to "real-world friction."
    */

    .key.pink {
      border-color:
        rgba(255, 61, 154, 0.65);

      background:
        rgba(255, 61, 154, 0.045);

      box-shadow:
        0 0 26px
        rgba(255, 61, 154, 0.08);
    }

    /*
      ITSBAD MAKER'S MARK

      More visible than the prior version,
      but still subtle enough to feel like a signature.
    */

    .maker-mark {
      position: absolute;

      right: 4.5%;
      bottom: 8%;

      display: flex;
      align-items: center;

      gap: 10px;

      z-index: 4;

      color:
        rgba(248, 251, 255, 0.75);

      font-size:
        clamp(11px, 1vw, 15px);

      font-weight: 800;

      letter-spacing: 0.14em;

      text-transform: uppercase;
    }

    .maker-line {
      width: 26px;
      height: 3px;

      border-radius: 99px;

      background:
        linear-gradient(
          90deg,
          var(--pink),
          var(--violet)
        );
    }

    /*
      PAGE CONTROLS
    */

    .controls {
      display: flex;
      flex-wrap: wrap;

      align-items: center;
      justify-content: space-between;

      gap: 14px;

      margin-top: 16px;
    }

    .instructions {
      max-width: 980px;

      margin: 0;

      color: #142336;

      font-size: 14px;

      line-height: 1.5;
    }

    button {
      border: 0;

      border-radius: 10px;

      padding: 12px 18px;

      background: var(--navy-950);

      color: #fff;

      font:
        700 14px
        Arial,
        Helvetica,
        sans-serif;

      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #173654;

      outline:
        3px solid
        rgba(255, 61, 154, 0.24);

      outline-offset: 2px;
    }

    /*
      Responsive preview only.
      Export stays at 1584 × 396.
    */

    @media (max-width: 850px) {

      body {
        padding: 12px;
      }

      .content {
        left: 27%;
        right: 23%;

        top: 10%;
        bottom: 10%;
      }

      .eyebrow {
        margin-bottom: 5px;
      }

      .personality-line {
        margin-top: 8px;
      }

      .keyboard-mark {
        right: -6%;
      }

      .maker-mark {
        display: none;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section
      class="banner"
      aria-label="LinkedIn banner for Brandi Neal"
    >

      <div
        class="photo-safe-area"
        aria-hidden="true"
      ></div>


      <!--
        ITSBAD KEYBOARD-INSPIRED WATERMARK
      -->

      <div
        class="keyboard-mark"
        aria-hidden="true"
      >

        <div
          class="key"
          style="left:0; top:18px;"
        ></div>

        <div
          class="key blue"
          style="left:72px; top:10px;"
        ></div>

        <div
          class="key"
          style="left:144px; top:2px;"
        ></div>


        <div
          class="key violet"
          style="left:28px; top:90px;"
        ></div>

        <div
          class="key pink"
          style="left:100px; top:82px;"
        ></div>

        <div
          class="key"
          style="left:172px; top:74px;"
        ></div>


        <div
          class="key"
          style="left:56px; top:162px;"
        ></div>

        <div
          class="key blue"
          style="left:128px; top:154px;"
        ></div>

        <div
          class="key"
          style="left:200px; top:146px;"
        ></div>

      </div>


      <!--
        PRIMARY PERSONAL BRAND MESSAGE
      -->

      <div class="content">

        <p class="eyebrow">
          AI • Product • Transformation
        </p>

        <h1>
          I build useful technology
          <br>
          for
          <span class="accent">
            real-world friction.
          </span>
        </h1>

        <p class="personality-line">
          Because some things shouldn’t be this hard.
        </p>

      </div>


      <!--
        QUIET ITSBAD SIGNATURE
      -->

      <div
        class="maker-mark"
        aria-label="ITSBAD Labs"
      >

        <span
          class="maker-line"
          aria-hidden="true"
        ></span>

        <span>
          ITSBAD / LABS
        </span>

      </div>

    </section>


    <div class="controls">

      <p class="instructions">
        Open this file in Chrome at 100% zoom and select
        <strong>Save banner as PNG</strong>.
        The exported banner is exactly
        <strong>1584 × 396 pixels</strong>.
      </p>

      <button
        type="button"
        onclick="downloadBanner()"
      >
        Save banner as PNG
      </button>

    </div>

  </main>


  <script>
    "use strict";


    /*
      DRAW ROUNDED KEY
    */

    function roundedRect(
      ctx,
      x,
      y,
      width,
      height,
      radius
    ) {

      ctx.beginPath();

      ctx.moveTo(
        x + radius,
        y
      );

      ctx.arcTo(
        x + width,
        y,
        x + width,
        y + height,
        radius
      );

      ctx.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        radius
      );

      ctx.arcTo(
        x,
        y + height,
        x,
        y,
        radius
      );

      ctx.arcTo(
        x,
        y,
        x + width,
        y,
        radius
      );

      ctx.closePath();
    }


    function drawKey(
      ctx,
      x,
      y,
      borderColor,
      fillColor = "rgba(255,255,255,0.012)"
    ) {

      roundedRect(
        ctx,
        x,
        y,
        60,
        60,
        11
      );

      ctx.fillStyle =
        fillColor;

      ctx.fill();

      ctx.strokeStyle =
        borderColor;

      ctx.lineWidth = 1;

      ctx.stroke();
    }


    /*
      EXPORT BANNER
    */

    function downloadBanner() {

      const width = 1584;
      const height = 396;


      const canvas =
        document.createElement("canvas");


      canvas.width = width;
      canvas.height = height;


      const ctx =
        canvas.getContext("2d");


      if (!ctx) {

        alert(
          "Your browser could not create the image. Please try Chrome or Edge."
        );

        return;
      }


      /*
        BACKGROUND
      */

      const background =
        ctx.createLinearGradient(
          0,
          0,
          width,
          height
        );


      background.addColorStop(
        0,
        "#06111f"
      );


      background.addColorStop(
        0.64,
        "#0a1a2c"
      );


      background.addColorStop(
        1,
        "#102a44"
      );


      ctx.fillStyle =
        background;


      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      /*
        SUBTLE BLUE LIGHT
      */

      const light =
        ctx.createRadialGradient(
          900,
          165,
          0,
          900,
          165,
          470
        );


      light.addColorStop(
        0,
        "rgba(74,168,255,0.07)"
      );


      light.addColorStop(
        1,
        "rgba(74,168,255,0)"
      );


      ctx.fillStyle =
        light;


      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      /*
        KEYBOARD MOTIF
      */

      const keyStartX = 1265;


      const keys = [

        {
          x: keyStartX,
          y: 64,
          border:
            "rgba(202,214,227,0.17)"
        },

        {
          x: keyStartX + 72,
          y: 56,
          border:
            "rgba(74,168,255,0.32)"
        },

        {
          x: keyStartX + 144,
          y: 48,
          border:
            "rgba(202,214,227,0.17)"
        },


        {
          x: keyStartX + 28,
          y: 136,
          border:
            "rgba(139,118,255,0.32)"
        },

        {
          x: keyStartX + 100,
          y: 128,
          border:
            "rgba(255,61,154,0.65)",
          fill:
            "rgba(255,61,154,0.045)"
        },

        {
          x: keyStartX + 172,
          y: 120,
          border:
            "rgba(202,214,227,0.17)"
        },


        {
          x: keyStartX + 56,
          y: 208,
          border:
            "rgba(202,214,227,0.17)"
        },

        {
          x: keyStartX + 128,
          y: 200,
          border:
            "rgba(74,168,255,0.32)"
        },

        {
          x: keyStartX + 200,
          y: 192,
          border:
            "rgba(202,214,227,0.17)"
        }

      ];


      ctx.globalAlpha =
        0.34;


      keys.forEach(
        key => {

          drawKey(
            ctx,
            key.x,
            key.y,
            key.border,
            key.fill
          );

        }
      );


      ctx.globalAlpha =
        1;


      /*
        TEXT POSITION

        Moved slightly right to leave deliberate
        separation from the LinkedIn profile photo.
      */

      const left = 460;


      /*
        EYEBROW
      */

      ctx.fillStyle =
        "#ff3d9a";


      ctx.font =
        "800 18px Arial";


      ctx.fillText(
        "AI  •  PRODUCT  •  TRANSFORMATION",
        left,
        75
      );


      /*
        HERO
      */

      ctx.fillStyle =
        "#f8fbff";


      ctx.font =
        "850 57px Arial";


      ctx.fillText(
        "I build useful technology",
        left,
        145
      );


      ctx.fillText(
        "for",
        left,
        203
      );


      const prefixWidth =
        ctx.measureText("for ").width;


      ctx.fillStyle =
        "#ff3d9a";


      ctx.fillText(
        "real-world friction.",
        left + prefixWidth,
        203
      );


      /*
        PERSONALITY LINE
      */

      ctx.fillStyle =
        "#d2dce7";


      ctx.font =
        "650 29px Arial";


      ctx.fillText(
        "Because some things shouldn’t be this hard.",
        left,
        261
      );


      /*
        ITSBAD MAKER'S MARK
      */

      const markX =
        1360;


      const markY =
        348;


      const markGradient =
        ctx.createLinearGradient(
          markX,
          markY,
          markX + 26,
          markY
        );


      markGradient.addColorStop(
        0,
        "#ff3d9a"
      );


      markGradient.addColorStop(
        1,
        "#8b76ff"
      );


      ctx.fillStyle =
        markGradient;


      ctx.fillRect(
        markX,
        markY - 4,
        26,
        3
      );


      ctx.fillStyle =
        "rgba(248,251,255,0.75)";


      ctx.font =
        "800 14px Arial";


      ctx.fillText(
        "ITSBAD / LABS",
        markX + 36,
        markY
      );


      /*
        DOWNLOAD
      */

      const download =
        document.createElement("a");


      download.download =
        "Brandi_Neal_LinkedIn_Banner.png";


      download.href =
        canvas.toDataURL("image/png");


      download.click();
    }
  </script>

</body>
</html>
